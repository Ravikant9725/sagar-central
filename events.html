<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events - Sagar Central</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #243b53;
            transition: 0.3s;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: #102a43;
            color: white;
            padding: 25px 15px;
            overflow-y: auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h2 {
            font-size: 23px;
        }

        .logo p {
            font-size: 12px;
            color: #bcccdc;
            margin-top: 5px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin: 7px 0;
        }

        .menu a {
            display: block;
            padding: 12px 14px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu a.active {
            background: #1976d2;
        }

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .box {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            margin-bottom: 20px;
        }

        h1,
        h2 {
            color: #102a43;
        }

        h2 {
            margin: 20px 0 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #bcccdc;
            border-radius: 8px;
            margin: 5px;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background: #1976d2;
            margin: 3px;
        }

        button:hover {
            opacity: 0.9;
        }

        .edit {
            background: #fb8c00;
        }

        .delete {
            background: #e53935;
        }

        .cancel {
            background: #78909c;
        }

        .search {
            width: 100%;
            margin: 0;
        }

        .event-card {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .07);
        }

        .event-title {
            font-weight: bold;
            font-size: 17px;
            color: #102a43;
            margin-bottom: 5px;
        }

        .event-info {
            color: #627d98;
            margin: 8px 0 12px;
        }

        #message {
            color: #1976d2;
            margin-top: 12px;
            font-weight: bold;
        }

        #eventList {
            list-style: none;
        }

        .empty {
            background: white;
            padding: 20px;
            border-radius: 10px;
            color: #627d98;
        }

        /* DARK MODE */

        body.dark-mode {
            background: #121212;
            color: #e0e0e0;
        }

        body.dark-mode .box,
        body.dark-mode .event-card,
        body.dark-mode .empty {
            background: #1e1e1e;
            color: #e0e0e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .4);
        }

        body.dark-mode h1,
        body.dark-mode h2,
        body.dark-mode .event-title {
            color: #ffffff;
        }

        body.dark-mode .event-info {
            color: #b0bec5;
        }

        body.dark-mode input {
            background: #2b2b2b;
            color: white;
            border-color: #555;
        }

        body.dark-mode input::placeholder {
            color: #aaa;
        }

        body.dark-mode .empty {
            color: #b0bec5;
        }

        @media (max-width: 650px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 15px;
            }

            input {
                width: 100%;
                margin: 5px 0;
            }

            button {
                margin-top: 5px;
            }
        }

        @media (max-width: 480px) {

            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .logo h2 {
                font-size: 0;
            }

            .logo h2::before {
                content: "SC";
                font-size: 20px;
            }

            .logo p {
                display: none;
            }

            .menu a {
                font-size: 0;
                text-align: center;
                padding: 13px 5px;
            }

            .menu a::first-letter {
                font-size: 20px;
            }

            .main {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 12px;
            }

            .box {
                padding: 16px;
            }

            h1 {
                font-size: 24px;
            }
        }

    </style>

</head>

<body>

<aside class="sidebar">

    <div class="logo">

        <h2>Sagar Central</h2>

        <p>
            Enterprise Management System
        </p>

    </div>

    <ul class="menu">

        <li>
            <a href="index.html">
                🏠 Dashboard
            </a>
        </li>

        <li>
            <a href="meetings.html">
                📅 Meetings
            </a>
        </li>

        <li>
            <a href="events.html" class="active">
                🎉 Events
            </a>
        </li>

        <li>
            <a href="policies.html">
                📜 Policies
            </a>
        </li>

        <li>
            <a href="tasks.html">
                ✅ Tasks
            </a>
        </li>

        <li>
            <a href="documents.html">
                📄 Documents
            </a>
        </li>

        <li>
            <a href="ai-assistant.html">
                🤖 AI Assistant
            </a>
        </li>

        <li>
            <a href="settings.html">
                ⚙️ Settings
            </a>
        </li>

    </ul>

</aside>


<main class="main">

    <div class="box">

        <h1>
            🎉 Events
        </h1>

    </div>


    <div class="box">

        <h2 id="formTitle">
            Add New Event
        </h2>

        <input
            type="text"
            id="eventTitle"
            placeholder="Event title"
        >

        <input
            type="date"
            id="eventDate"
        >

        <br><br>

        <button
            onclick="saveEvent()"
            id="saveButton"
        >
            Add Event
        </button>

        <button
            onclick="cancelEdit()"
            id="cancelButton"
            class="cancel"
            style="display:none;"
        >
            Cancel
        </button>

        <p id="message"></p>

    </div>


    <div class="box">

        <h2>
            Event Records
        </h2>

        <input
            class="search"
            type="text"
            id="searchEvent"
            placeholder="🔍 Search events..."
            oninput="displayEvents()"
        >

        <br>

        <input
            type="date"
            id="filterDate"
            onchange="displayEvents()"
        >

    </div>


    <ul id="eventList"></ul>

</main>


<script>

const API_URL = "https://sagar-central.onrender.com";

let events = [];

let editId = null;

let messageTimer;


// =====================================
// API REQUEST
// =====================================

async function apiRequest(url, options = {}) {

    const token =
        localStorage.getItem("token");

    if (!token) {

        window.location.href =
            "login.html";

        return null;
    }


    const response =
        await fetch(
            `${API_URL}${url}`,
            {
                ...options,

                headers: {
                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`,

                    ...(options.headers || {})
                }
            }
        );


    if (response.status === 401) {

        localStorage.removeItem("token");

        localStorage.removeItem("user");

        window.location.href =
            "login.html";

        return null;
    }


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.message ||
            "Something went wrong."
        );
    }


    return data;
}


// =====================================
// LOAD EVENTS
// =====================================

async function loadEvents() {

    try {

        const data =
            await apiRequest(
                "/api/events"
            );


        if (!data) {
            return;
        }


        events =
            Array.isArray(data)
                ? data
                : [];


        displayEvents();

    }

    catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to load events.",
            "error"
        );
    }
}


// =====================================
// SAVE EVENT
// =====================================

async function saveEvent() {

    const title =
        document
            .getElementById("eventTitle")
            .value
            .trim();


    const date =
        document
            .getElementById("eventDate")
            .value;


    if (title === "") {

        showMessage(
            "Please enter an event title.",
            "error"
        );

        return;
    }


    try {

        const eventData = {

            title: title,

            date: date

        };


        // ADD NEW EVENT

        if (editId === null) {

            const newEvent =
                await apiRequest(
                    "/api/events",
                    {
                        method: "POST",

                        body:
                            JSON.stringify(
                                eventData
                            )
                    }
                );


            if (!newEvent) {
                return;
            }


            events.push(newEvent);


            showMessage(
                "Event added successfully!",
                "success"
            );

        }


        // UPDATE EVENT

        else {

            const updatedEvent =
                await apiRequest(
                    `/api/events/${editId}`,
                    {
                        method: "PUT",

                        body:
                            JSON.stringify(
                                eventData
                            )
                    }
                );


            if (!updatedEvent) {
                return;
            }


            const index =
                events.findIndex(
                    event =>
                        event.id === editId
                );


            if (index !== -1) {

                events[index] =
                    updatedEvent;

            }


            showMessage(
                "Event updated successfully!",
                "success"
            );

        }


        clearForm();

        resetButton();

        editId = null;

        displayEvents();

    }

    catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to save event.",
            "error"
        );
    }
}


// =====================================
// EDIT EVENT
// =====================================

function editEvent(id) {

    const event =
        events.find(
            item =>
                item.id === id
        );


    if (!event) {
        return;
    }


    document
        .getElementById("eventTitle")
        .value =
            event.title || "";


    document
        .getElementById("eventDate")
        .value =
            event.date || "";


    editId = id;


    document
        .getElementById("formTitle")
        .innerText =
            "Edit Event";


    document
        .getElementById("saveButton")
        .innerText =
            "Update Event";


    document
        .getElementById("cancelButton")
        .style.display =
            "inline-block";


    clearMessage();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


// =====================================
// DELETE EVENT
// =====================================

async function deleteEvent(id) {

    const event =
        events.find(
            item =>
                item.id === id
        );


    if (!event) {
        return;
    }


    if (
        !confirm(
            `Delete "${event.title}"?`
        )
    ) {

        return;
    }


    try {

        const result =
            await apiRequest(
                `/api/events/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (!result) {
            return;
        }


        events =
            events.filter(
                item =>
                    item.id !== id
            );


        if (editId === id) {

            cancelEdit();

        }


        displayEvents();


        showMessage(
            "Event deleted successfully!",
            "success"
        );

    }

    catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to delete event.",
            "error"
        );
    }
}


// =====================================
// CLEAR FORM
// =====================================

function clearForm() {

    document
        .getElementById("eventTitle")
        .value = "";


    document
        .getElementById("eventDate")
        .value = "";
}


// =====================================
// CANCEL EDIT
// =====================================

function cancelEdit() {

    editId = null;

    clearForm();

    resetButton();

    clearMessage();
}


// =====================================
// RESET BUTTON
// =====================================

function resetButton() {

    document
        .getElementById("formTitle")
        .innerText =
            "Add New Event";


    document
        .getElementById("saveButton")
        .innerText =
            "Add Event";


    document
        .getElementById("cancelButton")
        .style.display =
            "none";
}


// =====================================
// MESSAGE
// =====================================

function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "message"
        );


    clearTimeout(messageTimer);


    element.innerText =
        message;


    if (type === "success") {

        element.style.color =
            "#2e7d32";

    }

    else {

        element.style.color =
            "#e53935";

    }


    messageTimer =
        setTimeout(
            function() {

                element.innerText = "";

            },
            3000
        );
}


function clearMessage() {

    document
        .getElementById("message")
        .innerText = "";
}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


// =====================================
// DISPLAY EVENTS
// =====================================

function displayEvents() {

    const query =
        document
            .getElementById(
                "searchEvent"
            )
            .value
            .trim()
            .toLowerCase();


    const filterDate =
        document
            .getElementById(
                "filterDate"
            )
            .value;


    const list =
        document.getElementById(
            "eventList"
        );


    list.innerHTML = "";


    const filtered =
        events.filter(
            function(event) {

                const title =
                    String(
                        event.title || ""
                    ).toLowerCase();


                const matchesSearch =
                    title.includes(
                        query
                    );


                const matchesDate =
                    filterDate === "" ||
                    event.date === filterDate;


                return (
                    matchesSearch &&
                    matchesDate
                );
            }
        );


    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <li class="empty">

                No events found.

            </li>

        `;

        return;
    }


    filtered.forEach(
        function(event) {

            const li =
                document.createElement(
                    "li"
                );


            li.className =
                "event-card";


            li.innerHTML = `

                <div class="event-title">

                    ${escapeHTML(
                        event.title ||
                        "Untitled Event"
                    )}

                </div>


                <div class="event-info">

                    📅
                    ${escapeHTML(
                        event.date ||
                        "No date"
                    )}

                </div>


                <button
                    class="edit"
                    onclick="editEvent('${event.id}')"
                >
                    ✏️ Edit
                </button>


                <button
                    class="delete"
                    onclick="deleteEvent('${event.id}')"
                >
                    🗑️ Delete
                </button>

            `;


            list.appendChild(li);

        }
    );
}


// =====================================
// APPLY SAVED THEME
// =====================================

function applyTheme() {

    const theme =
        localStorage.getItem(
            "theme"
        );


    if (theme === "dark") {

        document.body.classList.add(
            "dark-mode"
        );

    }

    else {

        document.body.classList.remove(
            "dark-mode"
        );

    }
}


// =====================================
// START
// =====================================

applyTheme();

loadEvents();

</script>


<script src="auth.js"></script>

</body>
